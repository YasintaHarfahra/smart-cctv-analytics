services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONPATH=/app
      # Set this to your Supabase Postgres connection string
      # Example: postgresql+psycopg2://postgres:YOUR_PASSWORD@db.YOUR_HOST.supabase.co:5432/postgres
      - DATABASE_URL=postgresql+psycopg2://postgres.zbunxkzntnjaknkeabpq:cctvanalytics123@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require
    networks:
      - cctv-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    # volumes:
    #   - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - cctv-network
    restart: unless-stopped
    environment:
      VITE_BACKEND_API_URL: 'http://backend:8000'

networks:
  cctv-network:
    driver: bridge
